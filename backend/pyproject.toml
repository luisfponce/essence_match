[project]
name = "essencematch-backend"
version = "0.1.0"
description = "FastAPI backend for EssenceMatch wellness catalog recommendations"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "pymysql>=1.1,<2",
  "PyJWT>=2.9,<3",
  "passlib[argon2]>=1.7,<2",
  "python-multipart>=0.0.9,<1",
  "mariadb~=1.1.12",
  "pydantic[email]",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "httpx>=0.27,<1",
  "alembic>=1.13,<2",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
